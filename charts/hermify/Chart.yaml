apiVersion: v2
name: hermify
description: >-
  A household (or team) of Hermes Agents on Kubernetes: one agent per person, shared
  Hindsight long-term memory, Open WebUI as the chat frontend, and optional SSH boxes
  with the hermes CLI.
type: application
version: 0.1.1
# Hermes Agent image tag the chart is tested with (agent.image.tag).
appVersion: "v0.23.1"
home: https://github.com/omar2535/Hermify
sources:
  - https://github.com/omar2535/Hermify
  - https://github.com/NousResearch/hermes-agent
  - https://github.com/vectorize-io/hindsight
  - https://github.com/open-webui/open-webui
maintainers:
  - name: omar2535
    url: https://github.com/omar2535
keywords:
  - hermes-agent
  - ai-agent
  - open-webui
  - hindsight
  - self-hosted
