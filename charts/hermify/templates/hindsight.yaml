{{- if .Values.hindsight.enabled }}
{{- $h := .Values.hindsight }}
{{- $gw := $h.gateway }}
{{- if $gw.enabled }}
# The bank gateway (files/hindsight-gateway.py): each agent's key opens only its own bank.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hindsight-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
data:
  server.py: |
    {{- .Files.Get "files/hindsight-gateway.py" | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- include "hermify.storageClass" . | indent 2 }}
  resources:
    requests:
      storage: {{ $h.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
spec:
  replicas: 1
  # RWO volume: the old pod must let go of it before the new one can attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hindsight
  template:
    metadata:
      labels:
        {{- include "hermify.podLabels" . | nindent 8 }}
        app: hindsight
      {{- if $gw.enabled }}
      annotations:
        hermify/gateway-checksum: {{ .Files.Get "files/hindsight-gateway.py" | sha256sum | trunc 16 }}
      {{- end }}
    spec:
      securityContext:
        # The image runs as UID 1000; make the volume writable for it.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with $h.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hindsight
          # The full image bundles the local embedding and reranker models.
          image: "{{ $h.image.repository }}:{{ $h.image.tag }}"
          imagePullPolicy: {{ $h.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 8888
            - name: ui
              containerPort: 9999
          env:
            # Fact extraction through the same OpenAI-compatible endpoint as the agents.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: {{ $h.llm.baseUrl | default .Values.llm.baseUrl | quote }}
            - name: HINDSIGHT_API_LLM_MODEL
              value: {{ $h.llm.model | default .Values.llm.model | quote }}
            - name: HINDSIGHT_API_WORKER_ID
              value: hindsight-0
            {{- range $k, $v := $h.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          # HINDSIGHT_API_LLM_API_KEY, HINDSIGHT_CP_ACCESS_KEY (UI login).
          envFrom:
            - secretRef:
                name: {{ $h.existingSecret | default "hindsight-secrets" }}
          resources:
            {{- toYaml $h.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            # Embedded Postgres (pg0) data for all banks.
            - name: data
              mountPath: /home/hindsight/.pg0
        {{- if $gw.enabled }}
        # Agents reach the API only through here (NetworkPolicy): their key picks the one
        # bank they may use. The UI talks to the API inside this pod and isn't affected.
        - name: gateway
          image: "{{ $h.image.repository }}:{{ $h.image.tag }}"
          imagePullPolicy: {{ $h.image.pullPolicy }}
          command: ["python3", "-I", "/gateway/server.py"]
          ports:
            - name: gateway
              containerPort: {{ $gw.port }}
          env:
            - name: GATEWAY_PORT
              value: {{ $gw.port | quote }}
            - name: UPSTREAM
              value: http://127.0.0.1:8888
            {{- range $i, $t := .Values.tenants }}
            {{- $ctx := dict "root" $ "t" $t }}
            - name: HERMIFY_BANK_{{ $i }}
              value: {{ include "hermify.bankId" $ctx | quote }}
            # optional: a Secret without the key only locks that person out of memory
            # (and the gateway logs it); it doesn't stop Hindsight from starting.
            - name: HERMIFY_KEY_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermify.secretName" $ctx }}
                  key: HINDSIGHT_API_KEY
                  optional: true
            {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 10
          volumeMounts:
            - name: gateway
              mountPath: /gateway
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
        {{- if $gw.enabled }}
        - name: gateway
          configMap:
            name: hindsight-gateway
            defaultMode: 0444
        {{- end }}
---
# The api port (8888) is what agents use; with the gateway on it leads to the gateway, which
# checks each agent's key. ui (9999) logs in with HINDSIGHT_CP_ACCESS_KEY and talks to the
# API inside the pod, so only the UI ever needs an ingress.
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
spec:
  selector:
    app: hindsight
  ports:
    - name: api
      port: 8888
      targetPort: {{ $gw.enabled | ternary "gateway" "api" }}
    - name: ui
      port: 9999
      targetPort: ui
{{- if $h.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
  {{- with $h.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $h.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $h.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $h.ingress.host }}
      secretName: {{ $h.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "hindsight.ingress.host is required" $h.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hindsight
                port:
                  name: ui
{{- end }}
{{- if and $gw.enabled $gw.ingress.enabled }}
---
# The bank gateway, for agents outside the cluster. The Service's api port leads to the
# gateway (not to Hindsight's API), so each request still needs a key for one bank.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
  {{- with $gw.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $gw.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $gw.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $gw.ingress.host }}
      secretName: {{ $gw.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "hindsight.gateway.ingress.host is required" $gw.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hindsight
                port:
                  name: api
{{- end }}
{{- end }}
