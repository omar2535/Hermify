{{- $any := false }}
{{- range $t := .Values.tenants }}{{ if ($t.box | default dict).enabled }}{{ $any = true }}{{ end }}{{ end }}
{{- if $any }}
# The box's startup script (files/box-start.sh), shared by every box.
apiVersion: v1
kind: ConfigMap
metadata:
  name: box
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
data:
  start.sh: |
    {{- .Files.Get "files/box-start.sh" | nindent 4 }}
{{- end }}
{{- range $t := .Values.tenants }}
{{- $box := $t.box | default dict }}
{{- if $box.enabled }}
{{- $persistence := $box.persistence | default dict }}
{{- $service := $box.service | default dict }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: box-keys-{{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hermes
    tenant: {{ $t.name }}
data:
  authorized_keys: |
    {{- $box.authorizedKeys | trim | nindent 4 }}
---
# /persist in the box: home/, host-keys/ (SSH host key), apt-archives/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: box-home-{{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hermes
    tenant: {{ $t.name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- include "hermify.storageClass" $ | indent 2 }}
  resources:
    requests:
      storage: {{ $persistence.size | default $.Values.box.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-{{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hermes
    tenant: {{ $t.name }}
  {{- with ($service.annotations | default $.Values.box.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type | default $.Values.box.service.type }}
  selector:
    app: hermes
    tenant: {{ $t.name }}
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
{{- if $box.traefikEntryPoint }}
---
# Raw TCP can't be routed by hostname, so each box needs its own Traefik entrypoint.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ssh-{{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hermes
    tenant: {{ $t.name }}
spec:
  entryPoints: [{{ $box.traefikEntryPoint }}]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: ssh-{{ $t.name }}
          port: 22
{{- end }}
{{- end }}
{{- end }}
