{{/*
Secrets the chart creates when no existingSecret is given. Random values are generated once
and kept on upgrades (lookup); "helm.sh/resource-policy: keep" leaves them behind on
uninstall, so a reinstall reuses the same keys. `helm template` can't look up, so it
prints new random values every time: that's expected.
*/}}
{{- $keyEnv := .Values.llm.apiKeyEnv }}
{{- range $t := .Values.tenants }}
{{- if not $t.existingSecret }}
{{- $name := printf "hermes-%s-secrets" $t.name }}
{{- $old := (lookup "v1" "Secret" $.Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hermes
    tenant: {{ $t.name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  API_SERVER_KEY: {{ index $old "API_SERVER_KEY" | default (randAlphaNum 48 | b64enc) }}
  {{- if and $.Values.hindsight.enabled $.Values.hindsight.gateway.enabled }}
  HINDSIGHT_API_KEY: {{ index $old "HINDSIGHT_API_KEY" | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
  {{- $llmKey := $t.llmApiKey | default $.Values.llm.apiKey }}
  {{ $keyEnv }}: {{ if $llmKey }}{{ $llmKey | b64enc }}{{ else }}{{ index $old $keyEnv | default ("none" | b64enc) }}{{ end }}
{{- end }}
{{- end }}
{{- if and .Values.hindsight.enabled .Values.hindsight.gateway.enabled }}
{{- range $x := .Values.hindsight.gateway.extraKeys }}
{{- if not $x.existingSecret }}
{{- $name := printf "hindsight-key-%s" $x.name }}
{{- $k := $x.secretKey | default "HINDSIGHT_API_KEY" }}
{{- $old := (lookup "v1" "Secret" $.Release.Namespace $name).data | default dict }}
---
# Extra gateway key {{ $x.name }} (opens bank {{ $x.bank }}). Read it with
# kubectl get secret {{ $name }} -o jsonpath='{.data.{{ $k }}}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
    app: hindsight
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $k }}: {{ index $old $k | default (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.hindsight.enabled (not .Values.hindsight.existingSecret) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace "hindsight-secrets").data | default dict }}
{{- $llmKey := .Values.hindsight.llmApiKey | default .Values.llm.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: hindsight-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: hindsight
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  HINDSIGHT_CP_ACCESS_KEY: {{ index $old "HINDSIGHT_CP_ACCESS_KEY" | default (randAlphaNum 48 | b64enc) }}
  HINDSIGHT_API_LLM_API_KEY: {{ if $llmKey }}{{ $llmKey | b64enc }}{{ else }}{{ index $old "HINDSIGHT_API_LLM_API_KEY" | default ("none" | b64enc) }}{{ end }}
{{- end }}
{{- if and .Values.openWebui.enabled (not .Values.openWebui.existingSecret) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace "open-webui-secrets").data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
    app: open-webui
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  WEBUI_SECRET_KEY: {{ index $old "WEBUI_SECRET_KEY" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
