{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $anyBox := false }}
{{- $openBox := false }}
{{- range $t := .Values.tenants }}
{{- $box := $t.box | default dict }}
{{- if $box.enabled }}
{{- $anyBox = true }}
{{- if ne (($box.service | default dict).type | default $.Values.box.service.type) "ClusterIP" }}{{ $openBox = true }}{{ end }}
{{- end }}
{{- end }}
# Ingress lockdown for the namespace. Hindsight's API has no auth and banks only separate
# memory by convention, so only agents may reach it; agents can't reach each other.
# Egress is open unless networkPolicies.egress.enabled (agent pods only, at the end).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- if .Values.openWebui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-webui-to-hermes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: open-webui
      ports:
        - port: 8642
        {{- if .Values.agent.outbox.enabled }}
        # The outbox file server (Hermify files filter).
        - port: {{ .Values.agent.outbox.port }}
        {{- end }}
{{- with (concat ($np.ingressFrom | default list) ($np.openWebuiExtraFrom | default list)) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-open-webui
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 8080
{{- end }}
{{- end }}
{{- if .Values.hindsight.enabled }}
{{- $gw := .Values.hindsight.gateway }}
{{- if $gw.enabled }}
---
# Hindsight's API has no per-bank auth: only the gateway may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-hindsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hindsight
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hindsight-gateway
      ports:
        - port: 8888
---
# Agents reach the gateway's API port, never its admin UI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-to-hindsight-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hindsight-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hermes
      ports:
        - port: 8889
{{- if and $gw.ingress.enabled $np.ingressFrom }}
---
# The gateway's hostname (hindsight.gateway.ingress): its API, and its admin UI unless
# uiPath is empty. From your ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-hindsight-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hindsight-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $np.ingressFrom | nindent 8 }}
      ports:
        - port: 8889
        {{- if $gw.ingress.uiPath }}
        - port: 8890
        {{- end }}
{{- end }}
{{- else }}
---
# No gateway: agents talk to Hindsight's API directly, and any agent can read any bank.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-to-hindsight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hindsight
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hermes
      ports:
        - port: 8888
{{- end }}
{{- if and .Values.hindsight.ingress.enabled $np.ingressFrom }}
---
# The Hindsight UI only (it has its own login); never the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-hindsight-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hindsight
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml $np.ingressFrom | nindent 8 }}
      ports:
        - port: 9999
{{- end }}
{{- end }}
{{- if $anyBox }}
---
# SSH into the boxes: from the ingress controller plus networkPolicies.boxExtraFrom (a
# cloudflared tunnel), or from anywhere when a box has its own LoadBalancer or NodePort
# Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-boxes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hermes
      box: "true"
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 22
      {{- if not $openBox }}
      {{- with (concat ($np.ingressFrom | default list) ($np.boxExtraFrom | default list)) }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
{{- $eg := $np.egress }}
{{- if and $eg.enabled .Values.tenants }}
---
# Agents and their boxes: cluster DNS, Hindsight (through the gateway when it's on), the
# internet outside privateRanges, and egress.extraRules. Nothing else: no LAN, no
# Kubernetes API or kubelet, no other namespaces, no other agents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermify.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml $eg.dns | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if and .Values.hindsight.enabled .Values.hindsight.gateway.enabled }}
    # The gateway's API port, never its admin UI.
    - to:
        - podSelector:
            matchLabels:
              app: hindsight-gateway
      ports:
        - port: 8889
    {{- else if .Values.hindsight.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: hindsight
      ports:
        - port: 8888
    {{- end }}
    {{- if $eg.internet }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $eg.privateRanges }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- end }}
    {{- with $eg.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- range $t := .Values.tenants }}
{{- with $t.egress }}
---
# {{ $t.name }} only (tenants[].egress), on top of hermes-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-egress-{{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermify.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: hermes
      tenant: {{ $t.name }}
  policyTypes: [Egress]
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
