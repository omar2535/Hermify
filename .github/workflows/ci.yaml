# Lint and render the chart on every PR and push to main. No cluster needed: the images
# are big (Hermes alone is ~2GB), so this checks the chart, not the apps.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.20.0
  KUBECONFORM_VERSION: v0.6.7
  KUBERNETES_VERSION: 1.33.0

jobs:
  chart:
    # Forgejo (where a mirror may live) also reads .github/workflows: run on GitHub only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint
        run: |
          helm lint charts/hermify --strict
          for f in ci/*.yaml examples/values-*.yaml; do
            echo "::group::lint $f"
            helm lint charts/hermify --strict -f "$f"
            echo "::endgroup::"
          done

      - name: Render and validate manifests
        run: |
          mkdir -p rendered
          for f in ci/*.yaml examples/values-*.yaml; do
            out="rendered/$(basename "$f" .yaml).yaml"
            helm template hermify charts/hermify -n hermify -f "$f" > "$out"
            echo "$f: $(grep -c '^kind:' "$out") objects"
          done
          # IngressRouteTCP is a Traefik CRD with no schema in the default catalog.
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -skip IngressRouteTCP rendered/*.yaml

      - name: Expected failures fail (with the chart's own message)
        run: |
          for f in ci/invalid/*.yaml; do
            if err=$(helm template t charts/hermify -f "$f" 2>&1 >/dev/null); then
              echo "::error::$f rendered, but should fail"; exit 1
            fi
            # A template bug would also fail; only the chart's validation counts.
            echo "$err" | grep -q 'execution error at (hermify/templates/' \
              || { echo "::error::$f failed for another reason: $err"; exit 1; }
            echo "ok: $f -> $(echo "$err" | head -1 | sed 's/.*): //')"
          done

      - name: Chart version matches no existing tag (on PRs)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --tags --quiet
          v=$(helm show chart charts/hermify | awk '/^version:/{print $2}')
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null && \
             ! git diff --quiet "v$v" -- charts/hermify; then
            echo "::warning::charts/hermify changed but version $v is already released; bump it in Chart.yaml"
          fi

  shellcheck:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck box-start.sh
        run: shellcheck --severity=error charts/hermify/files/box-start.sh
